[project]
name = "finance-qna"
version = "0.1.0"
description = "Personal financial statement Q&A agent with a rule-based evaluation harness"
requires-python = ">=3.11"
dependencies = [
    "langchain>=0.3",
    "langgraph>=0.2",
    "langchain-google-genai>=2.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
    "sqlalchemy>=2.0",
    "typer>=0.12",
    "faker>=26.0",
    "python-dotenv>=1.0",
    "python-dateutil>=2.9",
    "pyyaml>=6.0",
    "rich>=13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-python-dateutil>=2.9",
    "types-PyYAML>=6.0",
    "pandas-stubs>=2.0",
]
dashboard = [
    "streamlit>=1.30",
    "pandas>=2.0",
]

[project.scripts]
finance-qna = "finance_qna.cli.main:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["design"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# Typer's idiomatic parameter style requires calling typer.Option()/typer.Argument()
# in argument defaults; that's the documented usage, not a real mutable-default bug.
"src/finance_qna/cli/*.py" = ["B008"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/finance_qna", "eval"]

[[tool.mypy.overrides]]
module = ["faker.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
